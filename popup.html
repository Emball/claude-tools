<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudette</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 220px;
      background: #1a1a1a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 12px;
    }

    .title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8b8b8b;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .label {
      color: #c8c8c8;
    }

    .toggle-group {
      display: flex;
      background: #2a2a2a;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .toggle-group button {
      padding: 3px 10px;
      border: none;
      background: transparent;
      color: #8b8b8b;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .toggle-group button.active {
      background: #3a3a3a;
      color: #e8e8e8;
    }

    .divider {
      height: 1px;
      background: #2a2a2a;
      margin: 8px 0;
    }

    .status {
      font-size: 11px;
      color: #8b8b8b;
      min-height: 16px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="title">Export Settings</div>

  <div class="row">
    <span class="label">Format</span>
    <div class="toggle-group">
      <button id="btn-md" class="active">MD</button>
      <button id="btn-txt">TXT</button>
    </div>
  </div>

  <div class="divider"></div>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
